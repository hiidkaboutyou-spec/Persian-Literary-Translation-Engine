[package]
name = "literary-engine"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "literary-engine"
path = "src/main.rs"

[dependencies]
character-engine = { path = "../crates/character-engine" }
document-engine = { path = "../crates/document-engine" }
memory-engine = { path = "../crates/memory-engine" }
quality-engine = { path = "../crates/quality-engine" }
translation-core = { path = "../crates/translation-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
