[package]
name = "quality-engine"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[features]
default = []
language-diagnostics = ["dep:lingua"]

[dependencies]
text-normalization = { path = "../text-normalization" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lingua = { version = "=1.8.0", default-features = false, features = ["english", "persian"], optional = true }
