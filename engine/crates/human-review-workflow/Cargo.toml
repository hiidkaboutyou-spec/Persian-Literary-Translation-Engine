[package]
name = "human-review-workflow"
version = "0.1.0"
edition = "2021"

[dependencies]
character-engine = { path = "../character-engine" }
literary-intelligence-engine = { path = "../literary-intelligence-engine" }
memory-engine = { path = "../memory-engine" }
text-normalization = { path = "../text-normalization" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
document-engine = { path = "../document-engine" }
tempfile = "3"
