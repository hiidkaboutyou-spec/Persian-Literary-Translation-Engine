[package]
name = "project-engine"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
advanced-literary-analysis = { path = "../advanced-literary-analysis" }
character-engine = { path = "../character-engine" }
document-engine = { path = "../document-engine" }
human-review-workflow = { path = "../human-review-workflow" }
literary-intelligence-engine = { path = "../literary-intelligence-engine" }
memory-engine = { path = "../memory-engine" }
quality-engine = { path = "../quality-engine" }
translation-core = { path = "../translation-core" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "1"

[dev-dependencies]
literary-intelligence-engine = { path = "../literary-intelligence-engine" }
tempfile = "3"
