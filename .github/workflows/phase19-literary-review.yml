name: Phase 19 Literary Review

on:
  push:
    paths:
      - 'engine/crates/literary-review-engine/**'
      - 'engine/crates/project-engine/**'
      - 'engine/cli/**'
      - 'engine/Cargo.lock'
      - 'tools/literary-alignment/**'
      - 'docs/PHASE_19_RESEARCH.md'
      - 'docs/IMPLEMENTATION_ROADMAP.md'
      - 'docs/IMPLEMENTATION_STATUS.md'
      - 'docs/PMC_BOOTSTRAP.md'
      - 'AGENTS.md'
      - '.github/workflows/phase19-literary-review.yml'
  pull_request:
    paths:
      - 'engine/crates/literary-review-engine/**'
      - 'engine/crates/project-engine/**'
      - 'engine/cli/**'
      - 'engine/Cargo.lock'
      - 'tools/literary-alignment/**'
      - 'docs/PHASE_19_RESEARCH.md'
      - 'docs/IMPLEMENTATION_ROADMAP.md'
      - 'docs/IMPLEMENTATION_STATUS.md'
      - 'docs/PMC_BOOTSTRAP.md'
      - 'AGENTS.md'
      - '.github/workflows/phase19-literary-review.yml'

permissions:
  contents: read

concurrency:
  group: phase19-literary-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Engine lockfile satisfies manifests
        shell: bash
        run: |
          set -euo pipefail
          (cd engine && cargo metadata --locked --format-version 1 --no-deps > /dev/null)

      - name: Format
        working-directory: engine
        run: cargo fmt --all -- --check

      - name: Clippy affected review surfaces
        working-directory: engine
        run: cargo clippy --locked -p literary-review-engine -p project-engine -p literary-engine --all-targets -- -D warnings

      - name: Test literary review engine offline
        working-directory: engine
        env:
          OPENAI_API_KEY: ''
        run: cargo test --locked -p literary-review-engine

      - name: Test application-level Phase 19 workflow
        working-directory: engine
        env:
          OPENAI_API_KEY: ''
          LITERARY_ENGINE_ALIGNMENT_TOOL: ''
        run: cargo test --locked -p project-engine --test phase19_literary_review

      - name: Test affected application and CLI surfaces
        working-directory: engine
        env:
          OPENAI_API_KEY: ''
          LITERARY_ENGINE_ALIGNMENT_TOOL: ''
        run: cargo test --locked -p project-engine -p literary-engine

      - name: CLI exposes explicit literary review command
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet -p literary-engine -- --help | grep -q 'review-translation'

      - name: Audit engine dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-audit --locked 2>/dev/null || true
          cargo audit --file engine/Cargo.lock

  alignment-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Alignment lockfile satisfies manifests
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --no-deps --manifest-path tools/literary-alignment/Cargo.toml > /dev/null

      - name: Test protocol and native aligner without model feature
        run: cargo test --locked --manifest-path tools/literary-alignment/Cargo.toml --no-default-features

      - name: Check pinned BGE adapter
        run: cargo check --locked --manifest-path tools/literary-alignment/Cargo.toml --features bge

      - name: Validate installer shell
        run: bash -n tools/literary-alignment/install.sh

      - name: Audit alignment dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-audit --locked 2>/dev/null || true
          cargo audit --file tools/literary-alignment/Cargo.lock

      - name: Confirm compilation did not fetch model weights
        shell: bash
        run: |
          set -euo pipefail
          test ! -d .tools/models/fastembed
          test ! -d .fastembed_cache

  alignment-tool-macos-arm64:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check pinned BGE adapter on Apple Silicon
        run: cargo check --locked --manifest-path tools/literary-alignment/Cargo.toml --features bge

      - name: Confirm compilation did not fetch model weights
        shell: bash
        run: |
          set -euo pipefail
          test ! -d .tools/models/fastembed
          test ! -d .fastembed_cache
