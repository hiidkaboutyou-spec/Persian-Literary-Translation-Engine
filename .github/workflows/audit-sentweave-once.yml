name: Audit SentWeave Candidate Once

on:
  push:
    branches: [phase-19-literary-review-stack]
    paths:
      - '.github/workflows/audit-sentweave-once.yml'

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Apple Silicon when applicable
        if: matrix.os == 'macos-15'
        run: test "$(uname -m)" = arm64

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install exact attested SentWeave release
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/sentweave"
          PY="$RUNNER_TEMP/sentweave/bin/python"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install 'numpy>=1.26.4'
          printf '%s\n' 'sentweave==0.3.3 --hash=sha256:ef6414bdd1d7fa4064f31fdf1b446c7f2601955777fcdf64988fc09bca9d2940' > "$RUNNER_TEMP/sentweave.txt"
          "$PY" -m pip install --no-deps --require-hashes -r "$RUNNER_TEMP/sentweave.txt"
          "$PY" -c 'import importlib.metadata as m; assert m.version("sentweave") == "0.3.3"'

      - name: Run in-memory algorithm smoke without external model
        shell: bash
        run: |
          set -euo pipefail
          PY="$RUNNER_TEMP/sentweave/bin/python"
          "$PY" - <<'PY'
          import hashlib
          import numpy as np
          from sentweave import align

          class StableEncoder:
              def encode(self, sentences):
                  rows = []
                  for text in sentences:
                      digest = hashlib.sha256(text.encode('utf-8')).digest()
                      row = np.frombuffer(digest, dtype=np.uint8).astype(np.float32)[:16]
                      norm = np.linalg.norm(row)
                      rows.append(row / norm if norm else row)
                  return np.stack(rows)

          src = ['alpha', 'beta', 'gamma']
          tgt = ['alpha', 'beta', 'gamma']
          result = align(src, tgt, encoder=StableEncoder(), alignment_max_size=4, random_state=42)
          assert result.alignments
          assert 0.0 <= result.overall_score <= 1.0
          assert all(all(0 <= i < len(src) for i in block.src_indices) for block in result.alignments)
          assert all(all(0 <= i < len(tgt) for i in block.tgt_indices) for block in result.alignments)
          PY

      - name: Audit candidate dependency resolution
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          PY="$RUNNER_TEMP/sentweave/bin/python"
          "$PY" -m pip install pip-audit
          printf '%s\n' 'sentweave==0.3.3' > "$RUNNER_TEMP/sentweave-audit.txt"
          "$PY" -m pip_audit -r "$RUNNER_TEMP/sentweave-audit.txt"
