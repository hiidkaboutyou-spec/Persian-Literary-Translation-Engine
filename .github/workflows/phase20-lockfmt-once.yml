name: Phase 20 Lockfile Format Once

on:
  push:
    branches:
      - phase-20-publication-epub-roundtrip
    paths:
      - .github/workflows/phase20-lockfmt-once.yml

permissions:
  contents: write

env:
  CARGO_NET_RETRY: '5'

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase-20-publication-epub-roundtrip
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Regenerate current lockfile
        working-directory: engine
        run: cargo generate-lockfile
      - name: Format workspace
        working-directory: engine
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Check locked workspace
        working-directory: engine
        run: cargo check --locked --workspace
      - name: Clippy workspace
        working-directory: engine
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test workspace
        working-directory: engine
        run: cargo test --locked --workspace
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/phase20-lockfmt-once.yml
      - name: Commit validated lockfile and formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: refresh Phase 20 lockfile and formatting'
          git push origin HEAD:phase-20-publication-epub-roundtrip
