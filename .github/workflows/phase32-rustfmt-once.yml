name: Phase 32 Rustfmt Once

on:
  push:
    branches:
      - phase-32-blind-human-provider-review
    paths:
      - ".github/workflows/phase32-rustfmt-once.yml"

permissions:
  contents: write

jobs:
  rustfmt-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-32-blind-human-provider-review

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust workspace and commit only formatting changes
        working-directory: engine
        run: cargo fmt --all

      - name: Commit formatter output when needed
        run: |
          set -euo pipefail
          if git diff --quiet -- engine/cli/src/bin/literary-provider-review.rs; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/cli/src/bin/literary-provider-review.rs
          git commit -m "style: rustfmt Phase 32 review tool"
          git push origin HEAD:phase-32-blind-human-provider-review
