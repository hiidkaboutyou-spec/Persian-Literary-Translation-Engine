name: Maintain Phase 18 Once

on:
  push:
    branches: [phase-18-context-packet-v2]
    paths:
      - '.github/workflows/maintain-phase18-once.yml'

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: phase-18-context-packet-v2

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply Clippy-recommended default derive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('engine/crates/memory-engine/src/semantic.rs')
          text = path.read_text()
          text = text.replace(
              '#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(rename_all = "snake_case")]\npub enum SemanticMode {\n    Dense,\n    Rerank,\n    DenseThenRerank,\n}\n\nimpl Default for SemanticMode {\n    fn default() -> Self {\n        Self::DenseThenRerank\n    }\n}\n',
              '#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize, Default)]\n#[serde(rename_all = "snake_case")]\npub enum SemanticMode {\n    Dense,\n    Rerank,\n    #[default]\n    DenseThenRerank,\n}\n'
          )
          path.write_text(text)
          PY

      - name: Format changed Rust
        shell: bash
        run: |
          set -euo pipefail
          (cd engine && cargo fmt --all)
          cargo fmt --manifest-path tools/semantic-retrieval/Cargo.toml

      - name: Generate reproducible lockfiles
        shell: bash
        run: |
          set -euo pipefail
          (cd engine && cargo generate-lockfile)
          cargo generate-lockfile --manifest-path tools/semantic-retrieval/Cargo.toml

      - name: Commit maintenance output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add engine/crates/memory-engine/src/semantic.rs engine/Cargo.lock tools/semantic-retrieval/src/main.rs tools/semantic-retrieval/Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: harden Phase 18 dependency state'
          git push origin HEAD:phase-18-context-packet-v2
