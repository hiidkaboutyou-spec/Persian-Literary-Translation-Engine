name: Rust CI

on:
  push:
    paths:
      - 'engine/**'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    paths:
      - 'engine/**'
      - '.github/workflows/rust-ci.yml'

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build release CLI
        run: cargo build --release -p literary-engine
      - name: CLI help smoke test
        run: ./target/release/literary-engine --help
      - name: CLI version smoke test
        run: ./target/release/literary-engine --version
