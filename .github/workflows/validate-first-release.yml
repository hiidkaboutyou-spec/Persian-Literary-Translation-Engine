name: Validate First Release

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/validate-first-release.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: literary-engine-linux-x86_64
            binary: literary-engine
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: literary-engine-macos-arm64
            binary: literary-engine
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: literary-engine-windows-x86_64
            binary: literary-engine.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Resolve dependencies
        run: cargo generate-lockfile
      - name: Build release binary
        run: cargo build --release --locked -p literary-engine --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p release
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "release/${{ matrix.binary }}"
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: engine/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish v0.1.0
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
      - name: Normalize artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp dist/literary-engine-linux-x86_64/literary-engine release/literary-engine-linux-x86_64
          cp dist/literary-engine-macos-arm64/literary-engine release/literary-engine-macos-arm64
          cp dist/literary-engine-windows-x86_64/literary-engine.exe release/literary-engine-windows-x86_64.exe
          sha256sum release/* > release/SHA256SUMS.txt
      - name: Create release tag if needed
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v0.1.0 >/dev/null 2>&1; then
            echo 'v0.1.0 already exists; using existing tag.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a v0.1.0 -m 'Persian Literary Translation Engine v0.1.0'
            git push origin refs/tags/v0.1.0
          fi
      - name: Publish GitHub release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo 'Release v0.1.0 already exists; verifying assets.'
          else
            gh release create v0.1.0 \
              release/literary-engine-linux-x86_64 \
              release/literary-engine-macos-arm64 \
              release/literary-engine-windows-x86_64.exe \
              release/SHA256SUMS.txt \
              --verify-tag \
              --generate-notes \
              --title 'Persian Literary Translation Engine v0.1.0'
          fi
          assets="$(gh release view v0.1.0 --json assets --jq '.assets[].name')"
          grep -qx 'literary-engine-linux-x86_64' <<<"$assets"
          grep -qx 'literary-engine-macos-arm64' <<<"$assets"
          grep -qx 'literary-engine-windows-x86_64.exe' <<<"$assets"
          grep -qx 'SHA256SUMS.txt' <<<"$assets"
