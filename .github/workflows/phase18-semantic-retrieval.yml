name: Phase 18 Context and Semantic Retrieval

on:
  push:
    paths:
      - 'engine/crates/memory-engine/**'
      - 'engine/Cargo.lock'
      - 'tools/semantic-retrieval/**'
      - 'docs/PHASE_18_RESEARCH.md'
      - 'docs/IMPLEMENTATION_ROADMAP.md'
      - 'docs/IMPLEMENTATION_STATUS.md'
      - 'docs/PMC_BOOTSTRAP.md'
      - 'AGENTS.md'
      - '.github/workflows/phase18-semantic-retrieval.yml'
  pull_request:
    paths:
      - 'engine/crates/memory-engine/**'
      - 'engine/Cargo.lock'
      - 'tools/semantic-retrieval/**'
      - 'docs/PHASE_18_RESEARCH.md'
      - 'docs/IMPLEMENTATION_ROADMAP.md'
      - 'docs/IMPLEMENTATION_STATUS.md'
      - 'docs/PMC_BOOTSTRAP.md'
      - 'AGENTS.md'
      - '.github/workflows/phase18-semantic-retrieval.yml'

permissions:
  contents: read

concurrency:
  group: phase18-retrieval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-context:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Engine lockfile is current
        shell: bash
        run: |
          set -euo pipefail
          (cd engine && cargo generate-lockfile)
          git diff --exit-code -- engine/Cargo.lock

      - name: Format
        working-directory: engine
        run: cargo fmt --all -- --check

      - name: Clippy memory engine
        working-directory: engine
        run: cargo clippy -p memory-engine --all-targets -- -D warnings

      - name: Test memory engine
        working-directory: engine
        run: cargo test -p memory-engine

  semantic-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Semantic-tool lockfile is current
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path tools/semantic-retrieval/Cargo.toml
          git diff --exit-code -- tools/semantic-retrieval/Cargo.lock

      - name: Test protocol-only build
        run: cargo test --locked --manifest-path tools/semantic-retrieval/Cargo.toml --no-default-features

      - name: Check pinned BGE integration
        run: cargo check --locked --manifest-path tools/semantic-retrieval/Cargo.toml --features bge

      - name: Audit semantic dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-audit --locked 2>/dev/null || true
          cargo audit --file tools/semantic-retrieval/Cargo.lock

      - name: Confirm no model weights were downloaded by compilation
        shell: bash
        run: |
          set -euo pipefail
          test ! -d .tools/models/fastembed
          test ! -d .fastembed_cache
