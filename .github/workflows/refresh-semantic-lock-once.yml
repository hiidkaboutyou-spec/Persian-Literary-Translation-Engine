name: Refresh Semantic Lockfile Once

on:
  push:
    branches: [phase-19-literary-review-stack]
    paths:
      - '.github/workflows/refresh-semantic-lock-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: phase-19-literary-review-stack
          fetch-depth: 0
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Refresh semantic tool lockfile
        run: cargo generate-lockfile --manifest-path tools/semantic-retrieval/Cargo.toml
      - name: Commit lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/semantic-retrieval/Cargo.lock
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git commit -m 'chore: refresh semantic retrieval lockfile'
          git pull --rebase origin phase-19-literary-review-stack
          git push origin HEAD:phase-19-literary-review-stack
