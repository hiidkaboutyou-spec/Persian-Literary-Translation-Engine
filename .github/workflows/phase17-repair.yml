name: Phase 17 repair

on:
  push:
    branches:
      - phase-17-external-integrations
    paths:
      - .github/workflows/phase17-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: phase-17-external-integrations
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Repair BookForge error mapping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('engine/crates/document-engine/src/epub.rs')
          text = path.read_text()
          text = text.replace(
              'const BOOKFORGE_REVISION: &str = "23f8c9d3c97a06f48e13424698441bfb4b037844";',
              '#[cfg(feature = "bookforge-epub")]\nconst BOOKFORGE_REVISION: &str = "23f8c9d3c97a06f48e13424698441bfb4b037844";',
              1,
          )
          old = '''        BookforgeError::InvalidInput(message) => DocumentError::InvalidStructure(format!(
            "BookForge EPUB validation rejected {}: {message}",
            path.display()
        )),'''
          new = '''        BookforgeError::InvalidInput(message) if message.starts_with("EPUB decompression ") => {
            DocumentError::CorruptedFile(format!(
                "BookForge rejected malformed EPUB archive {}: {message}",
                path.display()
            ))
        }
        BookforgeError::InvalidInput(message) => DocumentError::InvalidStructure(format!(
            "BookForge EPUB validation rejected {}: {message}",
            path.display()
        )),'''
          if old not in text:
              raise SystemExit('expected InvalidInput mapping was not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo fmt --manifest-path engine/Cargo.toml --all -- --check
          cargo test --manifest-path engine/Cargo.toml -p document-engine --test ingestion
          cargo check --manifest-path engine/Cargo.toml -p document-engine --no-default-features
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/crates/document-engine/src/epub.rs
          git diff --cached --quiet && exit 0
          git commit -m "fix: classify malformed BookForge archives as corrupted"
          git push origin HEAD:phase-17-external-integrations
