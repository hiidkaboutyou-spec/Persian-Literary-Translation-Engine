name: Fix Phase 19 Provider Test Once

on:
  push:
    branches: [phase-19-literary-review-stack]
    paths:
      - '.github/workflows/fix-phase19-provider-test-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Phase 19 branch
        uses: actions/checkout@v7
        with:
          ref: phase-19-literary-review-stack

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Repair dimension-scope test
        shell: bash
        env:
          OLD_B64: ICAgICAgICBsZXQgcmVzdWx0ID0gcHJvdmlkZXIucmV2aWV3KCZyZXF1ZXN0KCkpLnVud3JhcF9lcnIoKTsKICAgICAgICBhc3NlcnQhKG1hdGNoZXMhKHJlc3VsdCwgUmV2aWV3UHJvdmlkZXJFcnJvcjo6U2NoZW1hVmlvbGF0aW9uKF8pKSk7CgogICAgICAgIGxldCBuYXR1cmFsbmVzc19yZXF1ZXN0ID0gUmV2aWV3UHJvdmlkZXJSZXF1ZXN0Ojpmcm9tX3RleHQoCg==
          NEW_B64: 
        run: |
          set -euo pipefail
          python3 -c 'import base64, os; from pathlib import Path; p=Path("engine/crates/literary-review-engine/src/provider.rs"); s=p.read_text(); old=base64.b64decode(os.environ["OLD_B64"]).decode(); new=base64.b64decode(os.environ["NEW_B64"]).decode(); assert old in s, "expected provider test fragment not found"; p.write_text(s.replace(old,new,1))'

      - name: Format and sync lockfile
        working-directory: engine
        run: |
          cargo fmt --all
          cargo generate-lockfile

      - name: Clippy review engine
        working-directory: engine
        run: cargo clippy -p literary-review-engine --all-targets -- -D warnings

      - name: Test review engine offline
        working-directory: engine
        env:
          OPENAI_API_KEY: ''
        run: cargo test -p literary-review-engine

      - name: Verify build is credential-free
        working-directory: engine
        env:
          OPENAI_API_KEY: ''
        run: cargo check -p literary-review-engine

      - name: Audit Rust dependency graph
        working-directory: engine
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add engine/Cargo.lock engine/crates/literary-review-engine/src/provider.rs
          if git diff --cached --quiet; then
            echo 'No repair changes required.'
            exit 0
          fi
          git commit -m 'test: enforce Phase 19 review dimension scoping'
          git push origin HEAD:phase-19-literary-review-stack
