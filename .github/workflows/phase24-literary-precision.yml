name: Phase 24 Literary Precision

on:
  push:
    branches:
      - main
      - phase-24-literary-precision-persian-polish
    paths:
      - 'engine/**'
      - '.github/workflows/phase24-literary-precision.yml'
      - 'docs/PHASE_24_RESEARCH.md'
      - 'docs/IMPLEMENTATION_ROADMAP.md'
      - 'docs/IMPLEMENTATION_STATUS.md'
      - 'docs/PMC_BOOTSTRAP.md'
      - 'docs/EXTERNAL_INTEGRATIONS.md'
      - 'AGENTS.md'
  pull_request:
    paths:
      - 'engine/**'
      - '.github/workflows/phase24-literary-precision.yml'
      - 'docs/PHASE_24_RESEARCH.md'
      - 'docs/IMPLEMENTATION_ROADMAP.md'
      - 'docs/IMPLEMENTATION_STATUS.md'
      - 'docs/PMC_BOOTSTRAP.md'
      - 'docs/EXTERNAL_INTEGRATIONS.md'
      - 'AGENTS.md'

permissions:
  contents: read

concurrency:
  group: phase24-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-and-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Bootstrap or verify engine lockfile
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^name = "rbook"$' Cargo.lock; then
            cargo metadata --locked --format-version 1 --no-deps > /dev/null
          else
            echo 'Phase 24 lockfile bootstrap: resolving the newly reviewed dev-only rbook dependency.'
            cargo check -p document-engine --tests
            grep -q '^name = "rbook"$' Cargo.lock
          fi

      - name: Upload resolved engine lockfile
        uses: actions/upload-artifact@v4
        with:
          name: phase24-engine-lockfile
          path: engine/Cargo.lock
          if-no-files-found: error

      - name: Verify formatting
        working-directory: engine
        run: cargo fmt --all -- --check

      - name: Clippy Phase 24 surfaces
        working-directory: engine
        run: cargo clippy -p text-normalization -p literary-review-engine -p project-engine -p document-engine --all-targets -- -D warnings

      - name: Test native Persian precision and EPUB differential validation
        working-directory: engine
        run: cargo test -p text-normalization -p literary-review-engine -p project-engine -p document-engine

      - name: Prove rbook remains dev-only
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /^\\[dependencies\\]/ { section="dependencies"; next }
            /^\\[dev-dependencies\\]/ { section="dev"; next }
            /^\\[/ { section="other"; next }
            /rbook/ {
              if (section != "dev") {
                print "rbook escaped the document-engine dev-dependency boundary" > "/dev/stderr"
                exit 1
              }
              found=1
            }
            END { if (!found) exit 1 }
          ' engine/crates/document-engine/Cargo.toml

  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Apple Silicon runner
        shell: bash
        run: test "$(uname -m)" = arm64

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compile Phase 24 surfaces
        working-directory: engine
        run: |
          if grep -q '^name = "rbook"$' Cargo.lock; then
            cargo check --locked -p text-normalization -p literary-review-engine -p project-engine -p document-engine --all-targets
          else
            cargo check -p text-normalization -p literary-review-engine -p project-engine -p document-engine --all-targets
          fi