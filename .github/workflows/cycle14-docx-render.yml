name: Cycle 14 DOCX Render

on:
  push:
    branches:
      - main
    paths:
      - 'engine/crates/document-engine/**'
      - 'engine/crates/project-engine/**'
      - 'engine/crates/literary-engine/**'
      - 'tools/docx-render-validator/**'
      - '.github/workflows/cycle14-docx-render.yml'
  pull_request:
    paths:
      - 'engine/crates/document-engine/**'
      - 'engine/crates/project-engine/**'
      - 'engine/crates/literary-engine/**'
      - 'tools/docx-render-validator/**'
      - '.github/workflows/cycle14-docx-render.yml'

permissions:
  contents: read

concurrency:
  group: cycle14-docx-render-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libreoffice-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install isolated DOCX render tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends libreoffice-writer poppler-utils
          soffice --version
          pdftotext -v 2>&1 | head -n 1

      - name: Verify committed engine lockfile
        working-directory: engine
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Exercise real application DOCX export
        shell: bash
        working-directory: engine
        run: |
          set -euo pipefail
          project=/tmp/cycle14-docx-render-project
          source=/tmp/cycle14-docx-render-source.txt
          rm -rf "$project"
          printf '%s\n' 'او می‌رود به https://example.com و برای user@example.org می‌نویسد.' > "$source"
          cargo run --locked --quiet -p literary-engine -- project create "$project" --name 'Cycle 14 DOCX Render'
          cargo run --locked --quiet -p literary-engine -- project import "$project" "$source"
          cargo run --locked --quiet -p literary-engine -- project analyze "$project"
          cargo run --locked --quiet -p literary-engine -- project translate "$project" --provider echo
          cargo run --locked --quiet -p literary-engine -- project export "$project" --export-format docx
          test -s "$project/exports/manuscript.docx"

      - name: Render DOCX and verify selectable mixed-script text
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'https://example.com' \
            'user@example.org' \
            'می‌رود' \
            > /tmp/cycle14-docx-render-expected.txt
          bash tools/docx-render-validator/validate.sh \
            /tmp/cycle14-docx-render-project/exports/manuscript.docx \
            /tmp/cycle14-docx-render-expected.txt

      - name: Upload rendered DOCX for human layout inspection
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cycle14-rights-safe-docx
          path: /tmp/cycle14-docx-render-project/exports/manuscript.docx
          if-no-files-found: error
          retention-days: 7
