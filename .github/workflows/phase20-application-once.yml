name: Phase 20 Application Once

on:
  push:
    branches:
      - phase-20-publication-epub-roundtrip
    paths:
      - .github/workflows/phase20-application-once.yml

permissions:
  contents: write

env:
  CARGO_NET_RETRY: '5'

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-20-publication-epub-roundtrip
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply application integration
        run: python3 .github/scripts/phase20_application.py
      - name: Format
        working-directory: engine
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Workspace check
        working-directory: engine
        run: cargo check --locked --workspace
      - name: Clippy affected crates
        working-directory: engine
        run: cargo clippy --locked -p document-engine -p project-engine -p literary-engine --all-targets -- -D warnings
      - name: Test affected crates
        id: tests
        continue-on-error: true
        shell: bash
        working-directory: engine
        run: |
          set -o pipefail
          cargo test --locked -p document-engine -p project-engine -p literary-engine 2>&1 | tee ../phase20-application-tests.log
      - name: Persist test diagnostic
        if: steps.tests.outcome == 'failure'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f phase20-application-tests.log
          git commit -m 'chore: capture Phase 20 application test diagnostic'
          git push origin HEAD:phase-20-publication-epub-roundtrip
          exit 1
      - name: Workspace audit
        working-directory: engine
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: Cleanup and commit validated integration
        run: |
          rm -f .github/scripts/phase20_application.py .github/workflows/phase20-application-once.yml phase20-application-tests.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: wire publication-grade EPUB export through application boundary'
          git push origin HEAD:phase-20-publication-epub-roundtrip