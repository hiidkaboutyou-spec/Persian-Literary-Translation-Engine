name: Cleanup Phase 18 CLI Imports Once

on:
  push:
    branches: [phase-18-semantic-integration-safety]
    paths:
      - '.github/workflows/cleanup-phase18-cli-imports-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout safety branch
        uses: actions/checkout@v7
        with:
          ref: phase-18-semantic-integration-safety

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Remove imports left by retired duplicate context tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('engine/cli/src/main.rs')
          text = path.read_text()
          for stale in [
              '    use character_engine::{CharacterProfile, RelationshipProfile};\n',
              '    use memory_engine::MemoryEntry;\n',
          ]:
              if text.count(stale) != 1:
                  raise SystemExit(f'unexpected stale import count for {stale!r}: {text.count(stale)}')
              text = text.replace(stale, '', 1)
          path.write_text(text)
          PY

      - name: Format
        working-directory: engine
        run: cargo fmt --all

      - name: Clippy CLI
        working-directory: engine
        run: cargo clippy -p literary-engine --all-targets -- -D warnings

      - name: Test CLI
        working-directory: engine
        run: cargo test -p literary-engine

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add engine/cli/src/main.rs
          git commit -m 'test: remove stale CLI context imports'
          git push origin HEAD:phase-18-semantic-integration-safety
