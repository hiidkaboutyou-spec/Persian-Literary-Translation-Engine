name: Harden Phase 18 Semantic Timeout Once

on:
  push:
    branches: [phase-18-semantic-integration-safety]
    paths:
      - '.github/workflows/harden-phase18-semantic-timeout-once.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout safety branch
        uses: actions/checkout@v7
        with:
          ref: phase-18-semantic-integration-safety

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Add bounded semantic subprocess timeout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('engine/crates/memory-engine/src/semantic.rs')
          text = path.read_text()

          replacements = [
              ('use std::io::Write;\n', 'use std::io::{Read, Write};\n'),
              ('use std::process::{Command, Stdio};\n', 'use std::process::{Command, Stdio};\nuse std::thread;\nuse std::time::{Duration, Instant};\n'),
              ('    Io(std::io::Error),\n    SidecarFailed', '    Io(std::io::Error),\n    Timeout { timeout_ms: u64 },\n    SidecarFailed'),
              ('            Self::Io(error) => write!(formatter, "semantic sidecar I/O error: {error}"),\n            Self::SidecarFailed', '            Self::Io(error) => write!(formatter, "semantic sidecar I/O error: {error}"),\n            Self::Timeout { timeout_ms } => write!(\n                formatter,\n                "semantic sidecar timed out after {timeout_ms} ms"\n            ),\n            Self::SidecarFailed'),
              ('pub struct SemanticSidecar {\n    executable: PathBuf,\n    max_candidates: usize,\n}', 'pub struct SemanticSidecar {\n    executable: PathBuf,\n    max_candidates: usize,\n    timeout: Duration,\n}'),
              ('            executable: executable.into(),\n            max_candidates: 512,\n', '            executable: executable.into(),\n            max_candidates: 512,\n            timeout: Duration::from_secs(180),\n'),
              ('    pub fn executable(&self) -> &Path {\n        &self.executable\n    }\n', '    pub fn with_timeout(mut self, timeout: Duration) -> Self {\n        self.timeout = timeout.max(Duration::from_millis(1));\n        self\n    }\n\n    pub fn executable(&self) -> &Path {\n        &self.executable\n    }\n'),
              ('''        child\n            .stdin\n            .as_mut()\n            .ok_or_else(|| SemanticError::Protocol("sidecar stdin was not available".into()))?\n            .write_all(&payload)?;\n\n        let output = child.wait_with_output()?;\n        if !output.status.success() {\n            return Err(SemanticError::SidecarFailed {\n                status: output.status.code(),\n                stderr: String::from_utf8_lossy(&output.stderr).into_owned(),\n            });\n        }\n\n        let response: SemanticRerankResponse = serde_json::from_slice(&output.stdout)\n''', '''        let mut stdin = child\n            .stdin\n            .take()\n            .ok_or_else(|| SemanticError::Protocol("sidecar stdin was not available".into()))?;\n        stdin.write_all(&payload)?;\n        drop(stdin);\n\n        let started = Instant::now();\n        let status = loop {\n            if let Some(status) = child.try_wait()? {\n                break status;\n            }\n            if started.elapsed() >= self.timeout {\n                let _ = child.kill();\n                let _ = child.wait();\n                return Err(SemanticError::Timeout {\n                    timeout_ms: self.timeout.as_millis().min(u128::from(u64::MAX)) as u64,\n                });\n            }\n            thread::sleep(Duration::from_millis(25));\n        };\n\n        let mut stdout = Vec::new();\n        let mut stderr = Vec::new();\n        if let Some(mut pipe) = child.stdout.take() {\n            pipe.read_to_end(&mut stdout)?;\n        }\n        if let Some(mut pipe) = child.stderr.take() {\n            pipe.read_to_end(&mut stderr)?;\n        }\n\n        if !status.success() {\n            return Err(SemanticError::SidecarFailed {\n                status: status.code(),\n                stderr: String::from_utf8_lossy(&stderr).into_owned(),\n            });\n        }\n\n        let response: SemanticRerankResponse = serde_json::from_slice(&stdout)\n'''),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected match count {text.count(old)} for snippet: {old[:80]!r}')
              text = text.replace(old, new, 1)

          marker = '''    #[test]\n    fn request_protocol_round_trips() {\n'''
          test = '''    #[cfg(unix)]\n    #[test]\n    fn sidecar_timeout_is_bounded() {\n        use std::fs;\n        use std::os::unix::fs::PermissionsExt;\n\n        let script = std::env::temp_dir().join(format!(\n            "literary-engine-semantic-timeout-{}-{}",\n            std::process::id(),\n            std::thread::current().name().unwrap_or("test")\n        ));\n        fs::write(&script, "#!/bin/sh\\nsleep 5\\n").unwrap();\n        let mut permissions = fs::metadata(&script).unwrap().permissions();\n        permissions.set_mode(0o700);\n        fs::set_permissions(&script, permissions).unwrap();\n\n        let request = SemanticRerankRequest::new(\n            "query",\n            vec![SemanticCandidate {\n                id: "known".into(),\n                text: "candidate".into(),\n            }],\n            1,\n        );\n        let sidecar = SemanticSidecar::new(&script).with_timeout(Duration::from_millis(50));\n        let result = sidecar.rerank(&request);\n        let _ = fs::remove_file(&script);\n        assert!(matches!(result, Err(SemanticError::Timeout { .. })));\n    }\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('test insertion marker not unique')
          text = text.replace(marker, test + marker, 1)
          path.write_text(text)
          PY

      - name: Format
        working-directory: engine
        run: cargo fmt --all

      - name: Clippy memory engine
        working-directory: engine
        run: cargo clippy -p memory-engine --all-targets -- -D warnings

      - name: Test memory engine
        working-directory: engine
        run: cargo test -p memory-engine

      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add engine/crates/memory-engine/src/semantic.rs
          git commit -m 'fix: bound semantic sidecar execution time'
          git push origin HEAD:phase-18-semantic-integration-safety
