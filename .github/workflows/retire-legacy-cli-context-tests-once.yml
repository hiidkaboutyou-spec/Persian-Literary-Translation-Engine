name: Retire Legacy CLI Context Tests Once

on:
  push:
    branches: [phase-18-semantic-integration-safety]
    paths:
      - '.github/workflows/retire-legacy-cli-context-tests-once.yml'

permissions:
  contents: write

jobs:
  update-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout safety branch
        uses: actions/checkout@v7
        with:
          ref: phase-18-semantic-integration-safety

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Remove tests for retired duplicate CLI context assembler
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('engine/cli/src/main.rs')
          text = path.read_text()
          names = [
              'chapter_context_combines_character_glossary_and_translation_memory',
              'approved_context_precedes_manuscript_seed_context',
              'reviewed_literary_findings_are_injected_only_into_their_own_chapter',
          ]
          for name in names:
              pattern = rf'\n    #\[test\]\n    fn {name}\(\) \{{.*?\n    \}}\n'
              text, count = re.subn(pattern, '\n', text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'expected one test block for {name}, found {count}')
          path.write_text(text)
          PY

      - name: Format
        working-directory: engine
        run: cargo fmt --all

      - name: Check CLI test target before shared-context migration
        working-directory: engine
        run: cargo check -p literary-engine --tests

      - name: Run CLI tests
        working-directory: engine
        run: cargo test -p literary-engine

      - name: Commit test cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add engine/cli/src/main.rs
          git commit -m 'test: retire duplicate CLI context assembler tests'
          git push origin HEAD:phase-18-semantic-integration-safety
