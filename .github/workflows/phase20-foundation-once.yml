name: Phase 20 Foundation Once

on:
  push:
    branches:
      - phase-20-publication-epub-roundtrip
    paths:
      - .github/workflows/phase20-foundation-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-20-publication-epub-roundtrip
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply migration
        run: python3 .github/scripts/phase20_foundation.py
      - name: Format
        working-directory: engine
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Check workspace
        working-directory: engine
        run: cargo check --locked --workspace
      - name: Clippy affected crates
        working-directory: engine
        run: cargo clippy --locked -p translation-core -p document-engine -p literary-review-engine -p project-engine -p literary-engine --all-targets -- -D warnings
      - name: Test affected crates
        working-directory: engine
        run: cargo test --locked -p translation-core -p document-engine -p literary-review-engine -p project-engine -p literary-engine
      - name: Remove temporary migration tooling
        run: rm .github/scripts/phase20_foundation.py .github/workflows/phase20-foundation-once.yml
      - name: Commit validated foundation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add adult intimacy fidelity foundation and EPUB block provenance'
          git push origin HEAD:phase-20-publication-epub-roundtrip
