name: Phase 20 Foundation Once

on:
  push:
    branches:
      - phase-20-publication-epub-roundtrip
    paths:
      - .github/workflows/phase20-foundation-once.yml

permissions:
  contents: write

env:
  CARGO_NET_RETRY: '5'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-20-publication-epub-roundtrip
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Repair migration anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/phase20_foundation.py')
          s = p.read_text()
          old = '    "pub struct TranslatedChapter {\\n",\n'
          new = '    "#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\\npub struct TranslatedChapter {\\n",\n'
          if old not in s:
              raise SystemExit('TranslatedChapter migration anchor not found')
          s = s.replace(old, new, 1)
          old = '''fn default_translation_style_profile() -> String {
              "literary".to_string()
          }

          pub struct TranslatedChapter {'''
          new = '''fn default_translation_style_profile() -> String {
              "literary".to_string()
          }

          #[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]
          pub struct TranslatedChapter {'''
          if old not in s:
              raise SystemExit('TranslatedChapter replacement body not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Apply migration
        run: python3 .github/scripts/phase20_foundation.py
      - name: Derive default style profile cleanly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('engine/crates/translation-core/src/style.rs')
          s = p.read_text()
          old = '''#[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub enum TranslationStyleProfile {
              Literary,
              AdultIntimacy,
          }

          impl Default for TranslationStyleProfile {
              fn default() -> Self {
                  Self::Literary
              }
          }
          '''
          new = '''#[derive(Debug, Clone, Copy, PartialEq, Eq, Default)]
          pub enum TranslationStyleProfile {
              #[default]
              Literary,
              AdultIntimacy,
          }
          '''
          if old not in s:
              raise SystemExit('TranslationStyleProfile default block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Update style-aware review tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('engine/crates/project-engine/src/application/literary_review.rs')
          s = p.read_text()
          old = 'let dimensions = provider_dimensions();'
          if old not in s:
              raise SystemExit('legacy provider_dimensions() test call not found')
          s = s.replace(old, 'let dimensions = provider_dimensions("literary");', 1)
          p.write_text(s)
          PY
      - name: Format
        working-directory: engine
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Check workspace
        id: workspace_check
        continue-on-error: true
        shell: bash
        working-directory: engine
        run: |
          set -o pipefail
          cargo check --locked --workspace 2>&1 | tee ../phase20-foundation-check.log
      - name: Persist compile diagnostic
        if: steps.workspace_check.outcome == 'failure'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f phase20-foundation-check.log
          git commit -m 'chore: capture Phase 20 foundation compile diagnostic'
          git push origin HEAD:phase-20-publication-epub-roundtrip
          exit 1
      - name: Clippy affected crates
        working-directory: engine
        run: cargo clippy --locked -p translation-core -p document-engine -p literary-review-engine -p project-engine -p literary-engine --all-targets -- -D warnings
      - name: Test affected crates
        id: tests
        continue-on-error: true
        working-directory: engine
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p translation-core -p document-engine -p literary-review-engine -p project-engine -p literary-engine 2>&1 | tee ../phase20-foundation-tests.log
      - name: Persist test diagnostic
        if: steps.tests.outcome == 'failure'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f phase20-foundation-tests.log
          git commit -m 'chore: capture Phase 20 foundation test diagnostic'
          git push origin HEAD:phase-20-publication-epub-roundtrip
          exit 1
      - name: Remove temporary migration tooling
        run: rm -f .github/scripts/phase20_foundation.py .github/workflows/phase20-foundation-once.yml phase20-foundation-check.log phase20-foundation-tests.log
      - name: Commit validated foundation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add adult intimacy fidelity foundation and EPUB block provenance'
          git push origin HEAD:phase-20-publication-epub-roundtrip