name: Wire Phase 19 Application Once

on:
  push:
    branches: [phase-19-literary-review-stack]
    paths:
      - '.github/workflows/wire-phase19-application-once.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Phase 19 branch
        uses: actions/checkout@v7
        with:
          ref: phase-19-literary-review-stack
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Wire ApplicationService and CLI
        run: |
          python3 tools/phase19-wire-patch.py
          sed -i 's/use std::path::{Path, PathBuf};/use std::path::PathBuf;/' engine/crates/project-engine/src/application/literary_review.rs

      - name: Format and sync engine lockfile
        working-directory: engine
        run: |
          cargo fmt --all
          cargo generate-lockfile

      - name: Clippy affected application surfaces
        working-directory: engine
        run: cargo clippy -p literary-review-engine -p project-engine -p literary-engine --all-targets -- -D warnings

      - name: Test review and application surfaces offline
        working-directory: engine
        env:
          OPENAI_API_KEY: ''
          LITERARY_ENGINE_ALIGNMENT_TOOL: ''
        run: |
          cargo test -p literary-review-engine
          cargo test -p project-engine
          cargo test -p literary-engine

      - name: Full workspace regression
        working-directory: engine
        env:
          OPENAI_API_KEY: ''
          LITERARY_ENGINE_ALIGNMENT_TOOL: ''
        run: cargo test --workspace

      - name: Security audit
        working-directory: engine
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Commit validated application integration
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add engine/Cargo.lock engine/crates/project-engine engine/cli/src
          if git diff --cached --quiet; then
            echo 'No application integration changes required.'
            exit 0
          fi
          git commit -m 'feat: expose Phase 19 literary review through ApplicationService'
          git pull --rebase origin phase-19-literary-review-stack
          git push origin HEAD:phase-19-literary-review-stack
