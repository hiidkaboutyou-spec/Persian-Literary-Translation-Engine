name: Sync Phase 17 Lockfile

on:
  push:
    branches:
      - phase-17-external-integrations
    paths:
      - '.github/workflows/sync-phase17-lockfile.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: phase-17-external-integrations

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate deterministic lockfile
        working-directory: engine
        run: cargo generate-lockfile

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- engine/Cargo.lock; then
            echo 'Cargo.lock is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine/Cargo.lock
          git commit -m 'Sync Cargo.lock for Phase 17 integrations'
          git push origin HEAD:phase-17-external-integrations
