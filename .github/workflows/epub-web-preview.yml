name: Local EPUB Web Preview

on:
  push:
    paths:
      - "tools/epub_web_preview/**"
      - ".github/workflows/epub-web-preview.yml"
  pull_request:
    paths:
      - "tools/epub_web_preview/**"
      - ".github/workflows/epub-web-preview.yml"

permissions:
  contents: read

concurrency:
  group: epub-web-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Compile preview tooling
        run: python -m compileall -q tools/epub_web_preview

      - name: Run preview tests
        run: python -m unittest tools.epub_web_preview.test_preview -v
