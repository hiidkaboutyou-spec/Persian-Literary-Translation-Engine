name: Local EPUB Web Preview

on:
  push:
    paths:
      - "tools/epub_web_preview/**"
      - ".github/workflows/epub-web-preview.yml"
  pull_request:
    paths:
      - "tools/epub_web_preview/**"
      - ".github/workflows/epub-web-preview.yml"

permissions:
  contents: read

concurrency:
  group: epub-web-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Compile preview tooling
        run: python -m compileall -q tools/epub_web_preview

      - name: Run preview tests
        run: python -m unittest tools.epub_web_preview.test_preview -v
