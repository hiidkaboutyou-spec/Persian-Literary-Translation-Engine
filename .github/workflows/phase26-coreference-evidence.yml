name: Phase 26 Long-Span Coreference Evidence

on:
  push:
    branches:
      - main
      - phase-26-long-span-coreference-evidence
    paths:
      - 'engine/crates/literary-intelligence-engine/**'
      - 'benchmarks/phase26/**'
      - '.github/workflows/phase26-coreference-evidence.yml'
      - 'docs/PHASE_26_RESEARCH.md'
      - 'docs/IMPLEMENTATION_ROADMAP.md'
      - 'docs/IMPLEMENTATION_STATUS.md'
      - 'docs/PMC_BOOTSTRAP.md'
      - 'docs/EXTERNAL_INTEGRATIONS.md'
      - 'AGENTS.md'
  pull_request:
    paths:
      - 'engine/crates/literary-intelligence-engine/**'
      - 'benchmarks/phase26/**'
      - '.github/workflows/phase26-coreference-evidence.yml'
      - 'docs/PHASE_26_RESEARCH.md'
      - 'docs/IMPLEMENTATION_ROADMAP.md'
      - 'docs/IMPLEMENTATION_STATUS.md'
      - 'docs/PMC_BOOTSTRAP.md'
      - 'docs/EXTERNAL_INTEGRATIONS.md'
      - 'AGENTS.md'

permissions:
  contents: read

concurrency:
  group: phase26-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-coreference-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # reviewed stable
        with:
          components: rustfmt, clippy

      - name: Verify committed dependency graph
        working-directory: engine
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Verify formatting
        working-directory: engine
        run: cargo fmt --all -- --check

      - name: Clippy coreference surfaces
        working-directory: engine
        run: cargo clippy --locked -p literary-intelligence-engine --all-targets -- -D warnings

      - name: Test protocol, benchmark, and Context Packet integration
        working-directory: engine
        run: cargo test --locked -p literary-intelligence-engine

      - name: Prove benchmark is project-owned and runtime remains model-free
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"synthetic": true' benchmarks/phase26/coreference-corpus-v1.json
          grep -q '"redistribution_allowed": true' benchmarks/phase26/coreference-corpus-v1.json
          ! grep -nEi 'torch|transformers|spacy|fastcoref|xcore|maverick|bookcoref'             engine/crates/literary-intelligence-engine/Cargo.toml

  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # reviewed stable

      - name: Compile and test coreference evidence
        working-directory: engine
        run: |
          cargo check --locked -p literary-intelligence-engine --all-targets
          cargo test --locked -p literary-intelligence-engine
