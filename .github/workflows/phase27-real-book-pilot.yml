name: Phase 27 Real-Book Pilot Readiness

on:
  push:
    branches:
      - main
      - phase-27-real-book-pilot-hardening
    paths:
      - 'engine/crates/project-engine/**'
      - '.github/workflows/phase27-real-book-pilot.yml'
      - 'docs/PHASE_27_RESEARCH.md'
      - 'docs/IMPLEMENTATION_ROADMAP.md'
      - 'docs/IMPLEMENTATION_STATUS.md'
      - 'docs/PMC_BOOTSTRAP.md'
      - 'AGENTS.md'
  pull_request:
    paths:
      - 'engine/crates/project-engine/**'
      - '.github/workflows/phase27-real-book-pilot.yml'
      - 'docs/PHASE_27_RESEARCH.md'
      - 'docs/IMPLEMENTATION_ROADMAP.md'
      - 'docs/IMPLEMENTATION_STATUS.md'
      - 'docs/PMC_BOOTSTRAP.md'
      - 'AGENTS.md'

permissions:
  contents: read

concurrency:
  group: phase27-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot-resume-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # reviewed stable
        with:
          components: rustfmt, clippy

      - name: Verify committed dependency graph
        working-directory: engine
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Verify formatting
        working-directory: engine
        run: cargo fmt --all -- --check

      - name: Clippy pilot surfaces
        working-directory: engine
        run: cargo clippy --locked -p project-engine --all-targets -- -D warnings

      - name: Test application workflow and Phase 27 regressions
        working-directory: engine
        run: cargo test --locked -p project-engine --test application_workflow

      - name: Prove no new runtime dependency was added
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 2d535ae520c9d064bbc74e95d494d2cb7dc282f0 -- engine/Cargo.toml engine/crates/project-engine/Cargo.toml

  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # reviewed stable

      - name: Compile and exercise pilot resume path
        working-directory: engine
        run: |
          cargo check --locked -p project-engine --all-targets
          cargo test --locked -p project-engine --test application_workflow bounded_resume_advances_past_reused_checkpoints
          cargo test --locked -p project-engine --test application_workflow changed_translation_plan_invalidates_stale_checkpoints
          cargo test --locked -p project-engine --test application_workflow phase27_pilot_readiness_repeated_resume_reaches_exact_completion_and_export
