name: Phase 20 Lock Validate Once

on:
  push:
    branches:
      - phase-20-publication-epub-roundtrip
    paths:
      - .github/workflows/phase20-lock-validate-once.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-20-publication-epub-roundtrip
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Refresh workspace lockfile
        working-directory: engine
        run: cargo generate-lockfile
      - name: Format
        working-directory: engine
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Clippy document engine
        working-directory: engine
        run: cargo clippy --locked -p document-engine --all-targets -- -D warnings
      - name: Test document engine
        working-directory: engine
        run: cargo test --locked -p document-engine
      - name: Compatibility without BookForge feature
        working-directory: engine
        run: cargo test --locked -p document-engine --no-default-features
      - name: Audit workspace
        working-directory: engine
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: Commit validated lock and cleanup
        run: |
          rm -f .github/workflows/phase20-lock-validate-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'build: refresh Phase 20 EPUB exporter lockfile'
          git push origin HEAD:phase-20-publication-epub-roundtrip