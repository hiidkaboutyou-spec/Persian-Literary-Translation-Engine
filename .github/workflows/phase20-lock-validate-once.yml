name: Phase 20 Lock Validate Once

on:
  push:
    branches:
      - phase-20-publication-epub-roundtrip
    paths:
      - .github/workflows/phase20-lock-validate-once.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-20-publication-epub-roundtrip
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Repair pinned quick-xml API use
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('engine/crates/document-engine/src/epub_export.rs')
          s = p.read_text()
          replacements = [
              ('if candidate != rebuild_stage {', 'if candidate != &rebuild_stage {'),
              ('writer.write_event(Event::Start(replacement)).map_err(xml_error)?;', 'writer.write_event(Event::Start(replacement)).map_err(DocumentError::Io)?;'),
              ('writer.write_event(Event::Empty(replacement)).map_err(xml_error)?;', 'writer.write_event(Event::Empty(replacement)).map_err(DocumentError::Io)?;'),
              ('other => writer.write_event(other.borrow()).map_err(xml_error)?,', 'other => writer.write_event(other.borrow()).map_err(DocumentError::Io)?,'),
              ('attributes.push((key, String::from_utf8_lossy(&value).into_owned()));', 'attributes.push((key, value.into_owned()));'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'expected exporter source not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Refresh workspace lockfile
        working-directory: engine
        run: cargo generate-lockfile
      - name: Format
        working-directory: engine
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Clippy document engine
        working-directory: engine
        run: cargo clippy --locked -p document-engine --all-targets -- -D warnings
      - name: Test document engine
        working-directory: engine
        run: cargo test --locked -p document-engine
      - name: Compatibility without BookForge feature
        working-directory: engine
        run: cargo test --locked -p document-engine --no-default-features
      - name: Audit workspace
        working-directory: engine
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: Commit validated exporter and cleanup
        run: |
          rm -f .github/workflows/phase20-lock-validate-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: validate Phase 20 EPUB round-trip exporter'
          git push origin HEAD:phase-20-publication-epub-roundtrip