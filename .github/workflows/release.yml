name: Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: literary-engine-linux-x86_64
            binary: literary-engine
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: literary-engine-macos-arm64
            binary: literary-engine
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: literary-engine-windows-x86_64
            binary: literary-engine.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Resolve dependencies
        run: cargo generate-lockfile
      - name: Build release binary
        run: cargo build --release --locked -p literary-engine --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p release
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "release/${{ matrix.binary }}"
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: engine/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14
