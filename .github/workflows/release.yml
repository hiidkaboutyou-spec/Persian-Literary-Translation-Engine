name: Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: literary-engine-linux-x86_64
            binary: literary-engine
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: literary-engine-macos-arm64
            binary: literary-engine
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: literary-engine-windows-x86_64
            binary: literary-engine.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Resolve dependencies
        run: cargo generate-lockfile
      - name: Build release binary
        run: cargo build --release --locked -p literary-engine --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p release
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "release/${{ matrix.binary }}"
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: engine/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Normalize release filenames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp dist/literary-engine-linux-x86_64/literary-engine release/literary-engine-linux-x86_64
          cp dist/literary-engine-macos-arm64/literary-engine release/literary-engine-macos-arm64
          cp dist/literary-engine-windows-x86_64/literary-engine.exe release/literary-engine-windows-x86_64.exe
          sha256sum release/* > release/SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/literary-engine-linux-x86_64 \
            release/literary-engine-macos-arm64 \
            release/literary-engine-windows-x86_64.exe \
            release/SHA256SUMS.txt \
            --verify-tag \
            --generate-notes \
            --title "Persian Literary Translation Engine ${GITHUB_REF_NAME}"
