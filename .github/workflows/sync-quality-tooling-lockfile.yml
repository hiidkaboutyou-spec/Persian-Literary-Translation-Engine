name: Sync Safe Quality Tooling Lockfile

on:
  push:
    branches:
      - chore/safe-quality-tooling
    paths:
      - '.github/workflows/sync-quality-tooling-lockfile.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: chore/safe-quality-tooling

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate deterministic lockfile
        working-directory: engine
        run: cargo generate-lockfile

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- engine/Cargo.lock; then
            echo 'Cargo.lock is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine/Cargo.lock
          git commit -m 'Sync Cargo.lock for safe quality tooling'
          git push origin HEAD:chore/safe-quality-tooling
