name: Format Phase 18 Once

on:
  workflow_dispatch:
  push:
    branches: [phase-18-context-packet-v2]
    paths:
      - '.github/workflows/format-phase18-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: phase-18-context-packet-v2

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Remove test-only import from production scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('engine/crates/memory-engine/src/context_v2.rs')
          text = path.read_text()
          text = text.replace('use std::collections::{BTreeMap, HashSet};', 'use std::collections::HashSet;')
          text = text.replace('mod tests {\n    use super::*;', 'mod tests {\n    use super::*;\n    use std::collections::BTreeMap;')
          path.write_text(text)
          PY

      - name: Format engine and isolated tool
        shell: bash
        run: |
          set -euo pipefail
          (cd engine && cargo fmt --all)
          cargo fmt --manifest-path tools/semantic-retrieval/Cargo.toml

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add engine/crates/memory-engine/src/context_v2.rs engine/crates/memory-engine/src/semantic.rs tools/semantic-retrieval/src/main.rs
          git commit -m 'style: format Phase 18 retrieval code'
          git push origin HEAD:phase-18-context-packet-v2
