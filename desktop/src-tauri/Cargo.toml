[package]
name = "persian-literary-translation-desktop"
version = "0.1.0"
description = "Desktop product surface for the Persian Literary Translation Engine"
authors = ["Persian Literary Translation Engine contributors"]
edition = "2021"

[lib]
name = "persian_literary_translation_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "persian-literary-translation"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
project-engine = { path = "../../engine/crates/project-engine" }
character-engine = { path = "../../engine/crates/character-engine" }
memory-engine = { path = "../../engine/crates/memory-engine" }
